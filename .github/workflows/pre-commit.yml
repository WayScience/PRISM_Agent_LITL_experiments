name: pre-commit

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  analysis-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            analysis/pyproject.toml

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" -e ./analysis

      - name: Run analysis tests
        run: python -m pytest tests/analysis
